<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pondr</title>
  <link rel="stylesheet" href="/styles.css">
  <style>body { background: transparent; }</style>
</head>
<body>
  <script src="/icons.js"></script>
  <script src="/common.js"></script>
  <script src="/duck.js"></script>
  <script>
    // Loaded by the browser extension in an iframe on supported checkout pages.
    (async () => {
      const q = new URLSearchParams(location.search);
      await getState();
      await PondrDuck.open({ amount: Number(q.get("amount")), currency: q.get("currency") || "", uncertain: q.get("uncertain") === "1", title: q.get("title") || "this order", newTab: true });
      new MutationObserver(() => {
        if (!document.getElementById("pondr-duck")) parent.postMessage({ pondr: "close" }, "*");
      }).observe(document.body, { childList: true });
    })();
  </script>
</body>
</html>
