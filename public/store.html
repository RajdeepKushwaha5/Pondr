<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pondr Demo Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="header"></div>
  <main class="wrap">
    <section class="store-hero">
      <div>
        <span class="eyebrow">Demo store · PayPal sandbox checkout</span>
        <h1>Nice things, <span class="serif">bought</span> on purpose.</h1>
      </div>
      <p>A sample shop with real PayPal sandbox checkout. Press <b>Pay with PayPal</b> and Pondr steps in first, just like the browser extension does on supported checkout pages.</p>
    </section>
    <div id="result"></div>
    <section class="products" id="products"></section>
  </main>
  <footer class="footer"><span>Pondr Demo Store · sample products · no real money moves</span></footer>
  <script src="/icons.js"></script>
  <script src="/common.js"></script>
  <script src="/duck.js"></script>
  <script>
    mountHeader("store");

    async function render() {
      const s = await getState();
      document.getElementById("products").innerHTML = s.products
        .map((p) => {
          const off = p.price < p.listPrice ? Math.round((1 - p.price / p.listPrice) * 100) : 0;
          return `<article class="product">
            <div style="position:relative">${PondrUI.productArt(p.art, 210)}${off ? `<span class="sale">−${off}%</span>` : ""}</div>
            <div class="meta"><span class="cat">${esc(p.category)}</span><h3>${esc(p.name)}</h3><span class="small muted">${esc(p.blurb || "")}</span></div>
            <div class="foot"><span class="price">${eur(p.price)}${off ? `<s>${eur(p.listPrice)}</s>` : ""}</span>
            <button class="btn paypal sm" data-id="${p.id}">Pay with PayPal</button></div>
          </article>`;
        })
        .join("");
      document.querySelectorAll("[data-id]").forEach((b) => (b.onclick = () => PondrDuck.open({ productId: b.dataset.id })));
    }

    async function showResult() {
      const pid = new URLSearchParams(location.search).get("done");
      if (!pid) return;
      const { payment, pond } = await api(`/api/payments/${pid}`);
      const ok = payment.status === "completed";
      if (ok && payment.kind === "pond" && payment.balanceAfter !== undefined) return goalMoment(payment);
      const title = ok ? (payment.kind === "pond" ? `${eur(payment.amount)} added to your ${esc(pond.name)} ledger.` : "Purchase complete.") : payment.status === "cancelled" ? "Payment cancelled." : "That didn't go through.";
      const sub = ok && payment.kind === "pond" ? `You pressed pay, and it went to your goal. Sandbox payment to ${esc(payment.payee || "Pondr Demo Merchant")}.` : esc(payment.description);
      document.getElementById("result").innerHTML = `<div class="notice">${PondrUI.duck(44, ok ? "happy" : "think")}
        <div><b style="font-family:var(--display);font-size:18px;letter-spacing:-.02em">${title}</b><div class="small muted">${sub}${payment.captureId ? ` · capture <code>${esc(payment.captureId)}</code>` : ""}</div></div>
        <span class="spacer"></span><a class="btn outline sm" href="/app.html">See my pond</a></div>`;
      history.replaceState(null, "", "/store.html");
      render();
    }


    // The emotional payoff: the impulse became visible progress toward the goal.
    function goalMoment(p) {
      const from = Math.min(100, (p.balanceBefore / p.target) * 100);
      const to = Math.min(100, (p.balanceAfter / p.target) * 100);
      const box = document.getElementById("result");
      box.innerHTML = `<section class="goal-moment">
        <div class="gm-duck">${PondrUI.duck(84, "happy")}</div>
        <div class="gm-body">
          <span class="eyebrow">You chose your future</span>
          <h2>${p.itemName ? `${esc(p.goalName)} over the ${esc(p.itemName)}.` : `${eur(p.amount)} toward ${esc(p.goalName)}.`}</h2>
          <p class="gm-lede">You still pressed pay. The urge got its moment, and ${eur(p.amount)} got a purpose${p.daysCloser ? `: about <b>${p.daysCloser} days closer</b>` : ""}.</p>
          <div class="gm-bar"><div class="gm-from" style="width:${from}%"></div><div class="gm-add" id="gmAdd" style="left:${from}%;width:0%"></div></div>
          <div class="gm-nums"><span>${eur(p.balanceBefore)}</span><b id="gmNow">${eur(p.balanceBefore)}</b><span>of ${eur(p.target)}</span></div>
          <div class="row" style="margin-top:16px">
            ${p.itemName ? `<button class="btn dark" id="gmWatch">Keep an eye on the ${esc(p.itemName)}</button><button class="btn outline" id="gmGo">Let it go</button>` : ""}
            <a class="btn outline" href="/app.html">See my goal</a>
          </div>
          <p class="gm-yours">It stays yours: pay your goal back to your PayPal any time with one tap (PayPal Payouts).</p>
          <p class="small muted" style="margin:6px 0 0">Goal-contribution prototype: ${window.PONDR_MODES?.paypal === "sandbox" ? "PayPal sandbox" : "mock"} payment to ${esc(p.payee || "Pondr Demo Merchant")}, recorded in your goal ledger · capture <code>${esc(p.captureId)}</code></p>
        </div></section>`;
      history.replaceState(null, "", "/store.html");
      requestAnimationFrame(() => setTimeout(() => {
        document.getElementById("gmAdd").style.width = `${to - from}%`;
        const start = performance.now(), dur = 1400;
        const tick = (t) => {
          const k = Math.min(1, (t - start) / dur), e = 1 - Math.pow(1 - k, 3);
          document.getElementById("gmNow").textContent = eur(Math.round(p.balanceBefore + (p.balanceAfter - p.balanceBefore) * e));
          if (k < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }, 250));
      const w = document.getElementById("gmWatch");
      if (w) w.onclick = async () => {
        const prod = (await getState()).products.find((x) => x.name === p.itemName);
        try {
          const m = await api("/api/mandates", { product_id: prod.id, max_price: Math.floor(prod.price * 0.85), cool_off_hours: 24 });
          toast(`Watching: only at €${m.maxPrice} or less, after 24h, if it fits your fun budget.`);
          w.disabled = true; w.textContent = "Watching it for you";
        } catch (e) { toast(e.message); }
      };
      const g = document.getElementById("gmGo");
      if (g) g.onclick = () => { toast("Let it go. Your goal keeps the win."); g.disabled = true; };
      render();
    }

    render();
    showResult();
    // Deep link for demos and the README: /store.html?open=p_headphones
    const openId = new URLSearchParams(location.search).get("open");
    if (openId) PondrDuck.open({ productId: openId });
  </script>
</body>
</html>
